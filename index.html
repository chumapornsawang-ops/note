<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Homework & Notes</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ffdce9,#fff5f8);
    color:#503b44;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.phone{
    width:390px;
    max-width:100%;
    min-height:100vh;
    margin:auto;
    background:linear-gradient(180deg,#fff7fa,#fff);
    position:relative;
    overflow:hidden;
}

.top{
    height:78px;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.time{
    font-size:17px;
    font-weight:bold;
}

.question{
    background:#ffe5ef;
    color:#e44e82;
    padding:9px 14px;
    border-radius:22px;
    font-size:13px;
    font-weight:bold;
}

.content{
    padding:5px 20px 105px;
}

.profile{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0 20px;
}

.hello small{
    color:#8d7780;
}

.hello h1{
    font-size:29px;
    color:#e94f88;
    margin-top:4px;
}

.hello p{
    font-size:12px;
    color:#927d85;
    margin-top:5px;
}

.avatar{
    width:78px;
    height:78px;
    border-radius:50%;
    background:linear-gradient(145deg,#ff8bb7,#df3470);
    border:5px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px #dc326055;
}

.shead{
    width:55px;
    height:60px;
    background:#e5326c;
    border:3px solid #62152e;
    border-radius:46%;
    position:relative;
}

.shead:before,
.shead:after{
    content:"";
    position:absolute;
    top:11px;
    width:22px;
    height:29px;
    background:#fff;
    border:3px solid #62152e;
}

.shead:before{
    left:2px;
    border-radius:80% 20% 70% 30%;
    transform:rotate(-14deg);
}

.shead:after{
    right:2px;
    border-radius:20% 80% 30% 70%;
    transform:rotate(14deg);
}

.hwbox{
    background:#ffe0ebbb;
    border:1px solid #ff9dbe66;
    border-radius:27px;
    padding:17px;
    box-shadow:0 10px 30px #de5a8220;
}

.boxtitle{
    display:flex;
    justify-content:space-between;
    margin-bottom:13px;
}

.boxtitle h2{
    font-size:19px;
}

.tabs{
    display:flex;
    background:#fff;
    border-radius:18px;
    padding:4px;
    margin-bottom:12px;
}

.tab{
    width:50%;
    padding:9px;
    border:0;
    background:transparent;
    border-radius:14px;
    color:#806c75;
    font-size:12px;
}

.tab.active{
    background:#ff82ac;
    color:#fff;
    font-weight:bold;
}

.alert{
    background:#fff;
    border-radius:14px;
    padding:11px;
    margin-bottom:11px;
    color:#dc557e;
    font-size:12px;
}

.list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:12px;
    display:flex;
    gap:10px;
    align-items:center;
    box-shadow:0 5px 15px #b4647d14;
}

.icon{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#ffe2ed;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.info{
    flex:1;
    min-width:0;
}

.info h3{
    font-size:13px;
    margin-bottom:3px;
}

.sub{
    font-size:10px;
    color:#99838b;
    margin-bottom:5px;
}

.deadline{
    font-size:10px;
    color:#dc4c78;
    background:#ffe7ef;
    padding:4px 6px;
    border-radius:8px;
}

.donebtn{
    width:30px;
    height:30px;
    border:0;
    border-radius:50%;
    background:#ffe0eb;
    color:#e65085;
}

.completed{
    opacity:.6;
}

.completed h3{
    text-decoration:line-through;
}

.quick-title{
    font-size:19px;
    margin:21px 0 11px;
}

.quick{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.q{
    border:0;
    border-radius:18px;
    padding:12px 4px;
    min-height:88px;
    background:linear-gradient(145deg,#ffd2e2,#fff0f6);
    color:#bd466e;
    box-shadow:0 7px 18px #be53781a;
}

.q:nth-child(2){
    background:linear-gradient(145deg,#ead3ff,#f9eefe);
    color:#8151b9;
}

.q:nth-child(3){
    background:linear-gradient(145deg,#ffe1d8,#fff2ed);
    color:#e36b5c;
}

.q:nth-child(4){
    background:linear-gradient(145deg,#efd2f5,#fbeafb);
    color:#914eb1;
}

.qi{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.q span:last-child{
    font-size:10px;
    font-weight:bold;
}

.nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:390px;
    max-width:100%;
    background:#fffafbf2;
    backdrop-filter:blur(15px);
    border-top:1px solid #f5dce5;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:8px 7px 13px;
    z-index:100;
}

.nav button{
    border:0;
    background:none;
    color:#77636c;
    font-size:9px;
    padding:5px 1px;
}

.nav button div{
    font-size:20px;
    margin-bottom:3px;
}

.nav .active{
    color:#e94d84;
    font-weight:bold;
}

.nav .active div{
    background:#ff83ac;
    color:#fff;
    width:48px;
    margin:auto auto 3px;
    border-radius:14px;
    padding:4px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#46233059;
    z-index:200;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modalbox{
    width:390px;
    max-width:100%;
    background:#fff;
    border-radius:27px;
    padding:22px;
    box-shadow:0 20px 60px #0003;
}

.modalbox h2{
    color:#e64f83;
    margin-bottom:16px;
}

.field{
    width:100%;
    padding:12px;
    border:1px solid #f0cbd8;
    border-radius:13px;
    margin-bottom:9px;
    outline:0;
}

.actions{
    display:flex;
    gap:8px;
}

.actions button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:13px;
}

.cancel{
    background:#f5eef1;
    color:#806d75;
}

.save{
    background:#f36b99;
    color:#fff;
}

/* ================= NOTES ================= */

.notePage{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:linear-gradient(135deg,#ffe1ec,#fff7fa);
    overflow:auto;
}

.noteTop{
    position:sticky;
    top:0;
    z-index:100;
    min-height:68px;
    background:#fffffff2;
    backdrop-filter:blur(15px);
    border-bottom:1px solid #f3d5e0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    gap:8px;
}

.roundbtn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#ffe1eb;
    color:#d94b7c;
    font-size:20px;
}

.saveNote{
    background:#f36b99;
    color:#fff;
}

.noteTopTitle{
    flex:1;
    text-align:center;
    font-size:16px;
    font-weight:bold;
    color:#5b3c48;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.paper{
    width:94%;
    max-width:900px;
    min-height:720px;
    margin:20px auto 50px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 15px 45px #96466426;
    padding:20px;
}

.noteName{
    width:100%;
    border:0;
    border-bottom:2px solid #ffd3e1;
    outline:0;
    padding:9px 5px;
    font-size:24px;
    font-weight:bold;
    color:#db4e7d;
    margin-bottom:12px;
}

.noteName::placeholder{
    color:#e7b5c6;
}

.toolbar{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    padding:9px;
    background:#fff0f5;
    border-radius:14px;
    margin-bottom:13px;
}

.toolbar button{
    min-width:36px;
    height:36px;
    padding:0 8px;
    border:0;
    border-radius:9px;
    background:#fff;
    color:#c94c77;
    box-shadow:0 3px 8px #be50781a;
}

.toolbar button:hover{
    background:#ff7fa8;
    color:#fff;
}

.colorInput{
    width:38px;
    height:36px;
    border:0;
    padding:2px;
    background:#fff;
    border-radius:9px;
}

.editor{
    min-height:420px;
    outline:0;
    padding:12px 8px;
    font-size:16px;
    line-height:2;
    background-image:
        linear-gradient(#f3dce4 1px,transparent 1px);
    background-size:100% 32px;
    overflow:hidden;
}

.editor:empty:before{
    content:attr(data-placeholder);
    color:#cdb4bd;
}

/* รูปในโน้ต */

.noteImage{
    max-width:100%;
    height:auto;
    display:inline-block;
    margin:8px;
    border:2px solid transparent;
    border-radius:10px;
    cursor:pointer;
    resize:both;
    overflow:auto;
}

.noteImage.selected{
    border:2px dashed #f36b99;
}

/* ตัวจัดการรูป */

.imageTools{
    display:none;
    gap:7px;
    align-items:center;
    flex-wrap:wrap;
    padding:8px;
    background:#fff5f8;
    border:1px solid #ffd4e1;
    border-radius:12px;
    margin-bottom:10px;
    font-size:11px;
}

.imageTools.show{
    display:flex;
}

.imageTools button{
    border:0;
    border-radius:8px;
    padding:7px 10px;
    background:#ffe0eb;
    color:#c64b76;
}

.imageTools input{
    width:80px;
}

.attachTitle{
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid #f2dce4;
    font-weight:bold;
    color:#704554;
}

.files{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:9px;
}

.fileItem{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    background:#fff1f6;
    border-radius:13px;
}

.fileIcon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.fileInfo{
    flex:1;
    min-width:0;
}

.fileName{
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.fileSize{
    font-size:10px;
    color:#9d828c;
    margin-top:2px;
}

.fileActions{
    display:flex;
    gap:5px;
}

.fileActions button{
    border:0;
    background:#ffd9e5;
    color:#d54d79;
    width:30px;
    height:30px;
    border-radius:9px;
}

.fileSizeControl{
    width:65px;
}

.noFile{
    text-align:center;
    color:#b39da5;
    font-size:12px;
    padding:12px;
}

/* ================= NOTES LIST ================= */

.notesListPage{
    display:none;
    position:fixed;
    inset:0;
    z-index:4500;
    background:linear-gradient(135deg,#ffe1ec,#fff7fa);
    overflow:auto;
}

.notesHeader{
    position:sticky;
    top:0;
    z-index:10;
    padding:15px;
    background:#ffffffee;
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.notesHeader h2{
    color:#db4e7d;
}

.noteGrid{
    max-width:900px;
    margin:auto;
    padding:18px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
}

.noteCard{
    background:#fff;
    border-radius:18px;
    padding:16px;
    box-shadow:0 8px 25px #9d53651a;
    cursor:pointer;
    border:1px solid #f6dbe4;
}

.noteCard h3{
    color:#d84e7b;
    margin-bottom:8px;
}

.noteCard p{
    font-size:11px;
    color:#99848c;
    height:38px;
    overflow:hidden;
}

.noteCard small{
    display:block;
    margin-top:10px;
    color:#c29ba9;
}

.deleteNote{
    margin-top:10px;
    border:0;
    background:#ffe1ea;
    color:#d24d78;
    padding:7px 10px;
    border-radius:8px;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#ffd4e5,#ff76a8 40%,#d82d69 75%,#7c163d);
    animation:introOut .65s ease forwards;
    animation-delay:3.35s;
}

.bigweb{
    position:absolute;
    width:680px;
    height:680px;
    border:3px solid #ffffffcc;
    border-radius:50%;
    opacity:0;
    animation:webIn .7s forwards,
              webMove 2s ease-in-out infinite;
}

.bigweb:before,
.bigweb:after{
    content:"";
    position:absolute;
    inset:0;
    border:2px solid #ffffff99;
    border-radius:50%;
}

.bigweb:before{
    transform:scale(.7);
}

.bigweb:after{
    transform:scale(.4);
}

.wl{
    left:-420px;
    top:-220px;
}

.wr{
    right:-420px;
    bottom:-230px;
}

.hero{
    position:relative;
    width:230px;
    height:390px;
    z-index:5;
    transform:translate(-600px,500px) rotate(-25deg) scale(.6);
    animation:
        jump 1.45s cubic-bezier(.15,.8,.25,1) forwards,
        float 1s ease-in-out 1.5s infinite;
}

.hhead{
    position:absolute;
    width:180px;
    height:185px;
    left:25px;
    background:linear-gradient(145deg,#ff8bb5,#ed3e78 60%,#a91d4d);
    border:5px solid #65152f;
    border-radius:48%;
    box-shadow:0 15px 35px #50001e66;
}

.heye{
    position:absolute;
    width:65px;
    height:90px;
    background:#fff;
    border:5px solid #511326;
}

.el{
    left:17px;
    top:50px;
    border-radius:80% 20% 70% 30%;
    transform:rotate(-17deg);
}

.er{
    right:17px;
    top:50px;
    border-radius:20% 80% 30% 70%;
    transform:rotate(17deg);
}

.hbody{
    position:absolute;
    width:160px;
    height:180px;
    left:35px;
    top:160px;
    border-radius:35% 35% 45% 45%;
    background:linear-gradient(145deg,#ff679c,#dc235f);
    border:5px solid #65152f;
    box-shadow:0 20px 35px #50001e59;
}

.logo{
    position:absolute;
    left:50%;
    top:30px;
    transform:translateX(-50%);
    font-size:52px;
}

.arm{
    position:absolute;
    width:105px;
    height:34px;
    top:35px;
    background:#dc235f;
    border:5px solid #65152f;
    border-radius:30px;
}

.al{
    left:-80px;
    transform:rotate(-35deg);
}

.ar{
    right:-80px;
    transform:rotate(35deg);
}

/* ใยจากมือ */

.webShot{
    position:absolute;
    width:150px;
    height:3px;
    background:#fff;
    box-shadow:0 0 8px #fff;
    opacity:0;
    z-index:20;
    transform-origin:left center;
}

.webLeft{
    left:-112px;
    top:200px;
    transform:rotate(-155deg);
    animation:shootLeft .7s ease-out 1.15s forwards;
}

.webRight{
    right:-112px;
    top:200px;
    transform-origin:right center;
    transform:rotate(-25deg);
    animation:shootRight .7s ease-out 1.15s forwards;
}

.introText{
    position:absolute;
    bottom:75px;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#fff;
    opacity:0;
    animation:introText .6s forwards .8s;
    text-shadow:0 3px 12px #50001e66;
}

.introText b{
    font-size:30px;
}

.introText span{
    margin-top:7px;
    font-size:14px;
}

@keyframes jump{
    0%{
        transform:translate(-600px,500px) rotate(-25deg) scale(.6);
    }
    45%{
        transform:translate(-100px,-80px) rotate(-12deg) scale(1.08);
    }
    65%{
        transform:translate(25px,20px) rotate(8deg) scale(1.03);
    }
    82%{
        transform:translate(0,-18px) rotate(-4deg);
    }
    100%{
        transform:translate(0) rotate(0) scale(1);
    }
}

@keyframes float{
    50%{
        transform:translateY(-12px);
    }
}

@keyframes webIn{
    to{
        opacity:.85;
        transform:scale(1);
    }
}

@keyframes webMove{
    50%{
        margin-left:30px;
        margin-top:-20px;
    }
}

@keyframes shootLeft{
    0%{
        width:0;
        opacity:1;
    }
    100%{
        width:150px;
        opacity:1;
    }
}

@keyframes shootRight{
    0%{
        width:0;
        opacity:1;
    }
    100%{
        width:150px;
        opacity:1;
    }
}

@keyframes introText{
    to{
        opacity:1;
    }
}

@keyframes introOut{
    0%,70%{
        opacity:1;
        visibility:visible;
    }
    100%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}

@media(min-width:600px){
    .phone{
        margin:25px auto;
        border-radius:35px;
        min-height:850px;
    }

    .nav{
        position:absolute;
        border-radius:0 0 35px 35px;
    }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <div class="bigweb wl"></div>
    <div class="bigweb wr"></div>

    <div class="hero">

        <div class="hhead">
            <div class="heye el"></div>
            <div class="heye er"></div>
        </div>

        <div class="hbody">
            <div class="logo">🕷️</div>
            <div class="arm al"></div>
            <div class="arm ar"></div>
        </div>

        <div class="webShot webLeft"></div>
        <div class="webShot webRight"></div>

    </div>

    <div class="introText">
        <b>Homework 💗</b>
        <span>พร้อมลุยการบ้านกันหรือยัง?</span>
    </div>
</div>


<!-- HOME -->
<div class="phone">

    <div class="top">
        <div class="time" id="time">10:10 น.</div>
        <div class="question">✏️ ทำการบ้านรึยัง?</div>
    </div>

    <main class="content">

        <section class="profile">
            <div class="hello">
                <small>สวัสดีตอนเช้า ☀️</small>
                <h1>สวัสดีค่ะ 💗</h1>
                <p>ตั้งใจเรียนและทำงานนะคะ!</p>
            </div>

            <div class="avatar">
                <div class="shead"></div>
            </div>
        </section>

        <section class="hwbox">

            <div class="boxtitle">
                <h2>📚 การบ้านของฉัน</h2>
                <span>💗</span>
            </div>

            <div class="tabs">
                <button class="tab active" id="pendingTab"
                        onclick="showTab('pending')">
                    ⏰ ยังไม่ทำ (<span id="pendingCount">0</span>)
                </button>

                <button class="tab" id="doneTab"
                        onclick="showTab('done')">
                    ✓ ทำแล้ว (<span id="doneCount">0</span>)
                </button>
            </div>

            <div class="alert">
                💗 อย่าลืมทำการบ้านนะ
            </div>

            <div class="list" id="homeworkList"></div>

        </section>

        <h2 class="quick-title">เมนูลัด</h2>

        <div class="quick">

            <button class="q" onclick="openNotesList()">
                <span class="qi">📝</span>
                <span>โน้ตทั้งหมด</span>
            </button>

            <button class="q" onclick="openModal()">
                <span class="qi">📖</span>
                <span>เพิ่มการบ้าน</span>
            </button>

            <button class="q" onclick="openReminder()">
                <span class="qi">⏰</span>
                <span>ตั้งเวลาเตือน</span>
            </button>

            <button class="q" onclick="showHelp()">
                <span class="qi">❔</span>
                <span>ช่วยเหลือ</span>
            </button>

        </div>

    </main>

    <nav class="nav">

        <button class="active" onclick="navClick(this,'home')">
            <div>⌂</div>
            หน้าแรก
        </button>

        <button onclick="navClick(this,'pending')">
            <div>📋</div>
            การบ้านที่ต้องส่ง
        </button>

        <button onclick="navClick(this,'done')">
            <div>✓</div>
            การบ้านที่ทำแล้ว
        </button>

        <button onclick="openNotesList()">
            <div>📝</div>
            โน้ต
        </button>

    </nav>
</div>


<!-- HOMEWORK MODAL -->
<div class="modal" id="modal">

    <div class="modalbox">

        <h2>➕ เพิ่มการบ้าน</h2>

        <input class="field" id="hwName"
               placeholder="ชื่อการบ้าน">

        <input class="field" id="hwSubject"
               placeholder="วิชา">

        <input class="field" id="hwDate" type="date">

        <input class="field" id="hwTime" type="time">

        <div class="actions">
            <button class="cancel" onclick="closeModal()">ยกเลิก</button>
            <button class="save" onclick="addHomework()">บันทึก</button>
        </div>

    </div>
</div>


<!-- NOTES LIST -->
<div class="notesListPage" id="notesListPage">

    <div class="notesHeader">

        <button class="roundbtn" onclick="closeNotesList()">←</button>

        <h2>📝 โน้ตของฉัน</h2>

        <button class="roundbtn saveNote"
                onclick="createNote()">
            ＋
        </button>

    </div>

    <div class="noteGrid" id="noteGrid"></div>

</div>


<!-- NOTE EDITOR -->
<div class="notePage" id="notePage">

    <div class="noteTop">

        <button class="roundbtn" onclick="closeNotePage()">←</button>

        <div class="noteTopTitle" id="noteTitleDisplay">
            โน้ตใหม่
        </div>

        <button class="roundbtn"
                onclick="downloadNote()">
            ⬇️
        </button>

        <button class="roundbtn saveNote"
                onclick="saveCurrentNote()">
            💾
        </button>

    </div>


    <div class="paper">

        <input class="noteName"
               id="noteTitle"
               placeholder="ตั้งชื่อโน้ต..."
               oninput="updateNoteTitle()">


        <div class="toolbar">

            <button onclick="formatText('bold')"><b>B</b></button>

            <button onclick="formatText('italic')"><i>I</i></button>

            <button onclick="formatText('underline')"><u>U</u></button>

            <button onclick="formatText('insertUnorderedList')">☷</button>

            <button onclick="formatText('justifyLeft')">≡</button>

            <button onclick="formatText('justifyCenter')">≣</button>

            <button onclick="formatText('justifyRight')">≡</button>

            <button onclick="formatText('undo')">↶</button>

            <button onclick="formatText('redo')">↷</button>

            <button onclick="formatText('removeFormat')">✕</button>

            <input class="colorInput"
                   id="textColor"
                   type="color"
                   value="#d94b7c"
                   onchange="changeTextColor(this.value)">

            <button onclick="document.getElementById('imageInput').click()">
                🖼️ รูป
            </button>

            <input id="imageInput"
                   type="file"
                   accept="image/*"
                   multiple
                   hidden
                   onchange="insertImages(event)">

            <button onclick="document.getElementById('fileInput').click()">
                📎 ไฟล์
            </button>

            <input id="fileInput"
                   type="file"
                   multiple
                   hidden
                   onchange="addFiles(event)">

            <button onclick="startDrawing()">
                ✏️ ขีดเขียน
            </button>

        </div>


        <!-- IMAGE CONTROL -->
        <div class="imageTools" id="imageTools">

            <span>ขนาดรูป:</span>

            <input type="range"
                   id="imageScale"
                   min="10"
                   max="100"
                   value="50"
                   oninput="resizeSelectedImage(this.value)">

            <span id="imageScaleText">50%</span>

            <button onclick="deleteSelectedImage()">
                🗑️ ลบรูป
            </button>

        </div>


        <!-- EDITOR -->
        <div id="noteEditor"
             class="editor"
             contenteditable="true"
             data-placeholder="เริ่มเขียนโน้ตของคุณที่นี่...">
        </div>


        <!-- DRAWING -->
        <div id="drawingBox"
             style="display:none;margin-top:15px">

            <div style="
                display:flex;
                gap:6px;
                flex-wrap:wrap;
                margin-bottom:8px;
            ">

                <input id="penColor"
                       type="color"
                       value="#e94f88">

                <label style="font-size:12px">
                    ขนาด
                    <input id="penSize"
                           type="range"
                           min="1"
                           max="30"
                           value="5">
                </label>

                <button onclick="setEraser(false)"
                        style="border:0;padding:7px;border-radius:8px">
                    ✏️ ปากกา
                </button>

                <button onclick="setEraser(true)"
                        style="border:0;padding:7px;border-radius:8px">
                    🧽 ยางลบ
                </button>

                <button onclick="clearCanvas()"
                        style="border:0;padding:7px;border-radius:8px">
                    🗑️ ล้าง
                </button>

                <button onclick="closeDrawing()"
                        style="border:0;padding:7px;border-radius:8px">
                    ✓ เสร็จ
                </button>

            </div>

            <canvas id="drawCanvas"
                    style="
                    width:100%;
                    height:300px;
                    background:#fffdfd;
                    border:2px dashed #f3c7d5;
                    border-radius:14px;
                    touch-action:none;
                    ">
            </canvas>

        </div>


        <div class="attachTitle">
            📎 ไฟล์ที่แนบ
        </div>

        <div class="files" id="fileList">
            <div class="noFile">ยังไม่มีไฟล์ที่แนบ</div>
        </div>

    </div>
</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let homework =
JSON.parse(localStorage.getItem('homeworkData') || 'null') || [];

let notes =
JSON.parse(localStorage.getItem('allNotes') || 'null') || [];

let currentTab = 'pending';
let currentNoteId = null;
let attachedFiles = [];
let selectedImage = null;


/* =========================================================
   HOMEWORK
========================================================= */

function today(){

    return new Date()
        .toISOString()
        .split('T')[0];

}

function saveHW(){

    localStorage.setItem(
        'homeworkData',
        JSON.stringify(homework)
    );

}

function fmt(d){

    const x = new Date(d + 'T00:00:00');

    return `${x.getDate()}/${x.getMonth()+1}/${x.getFullYear()+543}`;

}

function esc(s){

    const d = document.createElement('div');

    d.textContent = s || '';

    return d.innerHTML;

}

function updateTime(){

    const d = new Date();

    document.getElementById('time').textContent =
        `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;

}

setInterval(updateTime,1000);
updateTime();


function renderHomework(){

    const pending = homework.filter(x => !x.done);
    const done = homework.filter(x => x.done);

    document.getElementById('pendingCount').textContent =
        pending.length;

    document.getElementById('doneCount').textContent =
        done.length;

    const data =
        currentTab === 'pending'
        ? pending
        : done;

    const list =
        document.getElementById('homeworkList');

    list.innerHTML = '';

    if(!data.length){

        list.innerHTML =
            '<div class="noFile">🎉 ไม่มีรายการค่ะ 💗</div>';

        return;
    }

    data.forEach(x => {

        const el = document.createElement('div');

        el.className =
            'card ' + (x.done ? 'completed' : '');

        el.innerHTML = `

            <div class="icon">📚</div>

            <div class="info">

                <h3>${esc(x.name)}</h3>

                <div class="sub">${esc(x.subject)}</div>

                <span class="deadline">
                    ${
                        x.done
                        ? '✓ ทำเสร็จแล้ว'
                        : 'ต้องส่ง ' + fmt(x.date) +
                          ' ' + x.time + ' น.'
                    }
                </span>

            </div>

            <button class="donebtn"
                    onclick="toggleDone(${x.id})">
                ${x.done ? '↩' : '✓'}
            </button>
        `;

        list.appendChild(el);

    });

}


function showTab(t){

    currentTab = t;

    document.getElementById('pendingTab')
        .classList.toggle('active',t === 'pending');

    document.getElementById('doneTab')
        .classList.toggle('active',t === 'done');

    renderHomework();

}


function toggleDone(id){

    homework = homework.map(x => {

        if(x.id === id){

            return {
                ...x,
                done:!x.done
            };

        }

        return x;

    });

    saveHW();
    renderHomework();

}


function openModal(){

    document.getElementById('modal')
        .classList.add('show');

}

function closeModal(){

    document.getElementById('modal')
        .classList.remove('show');

}


function addHomework(){

    const name =
        document.getElementById('hwName').value.trim();

    const subject =
        document.getElementById('hwSubject').value.trim();

    const date =
        document.getElementById('hwDate').value;

    const time =
        document.getElementById('hwTime').value;

    if(!name || !subject || !date || !time){

        alert('กรุณากรอกข้อมูลให้ครบค่ะ');

        return;

    }

    homework.unshift({

        id:Date.now(),
        name,
        subject,
        date,
        time,
        done:false

    });

    saveHW();

    ['hwName','hwSubject','hwDate','hwTime']
        .forEach(id => {
            document.getElementById(id).value = '';
        });

    closeModal();

    showTab('pending');

}


function openReminder(){

    const p = homework.filter(x => !x.done);

    if(!p.length){

        alert('ไม่มีการบ้านที่ต้องเตือนค่ะ 💗');

        return;

    }

    alert(
        '🔔 การบ้านที่ต้องส่ง\n\n' +
        p.map(x =>
            '• ' + x.name +
            ' — ' + fmt(x.date) +
            ' ' + x.time + ' น.'
        ).join('\n')
    );

}


function navClick(btn,page){

    document.querySelectorAll('.nav button')
        .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    if(page === 'pending') showTab('pending');
    if(page === 'done') showTab('done');
    if(page === 'home') showTab('pending');

}


function showHelp(){

    alert(
        '💗 วิธีใช้งาน\n\n' +
        '📝 โน้ตทั้งหมด = สร้างและจัดการหลายโน้ต\n' +
        '🖼️ รูป = เพิ่มรูปลงในโน้ต\n' +
        '✏️ ขีดเขียน = วาดด้วยนิ้วหรือเมาส์\n' +
        '📎 ไฟล์ = แนบ PDF / Word / Excel ฯลฯ\n' +
        '💾 = บันทึกโน้ต\n' +
        '⬇️ = ดาวน์โหลดโน้ต'
    );

}


/* =========================================================
   NOTES DATABASE
========================================================= */

function saveNotesDB(){

    localStorage.setItem(
        'allNotes',
        JSON.stringify(notes)
    );

}


function createNote(){

    const note = {

        id:Date.now(),

        title:'โน้ตใหม่',

        content:'',

        files:[],

        created:new Date().toLocaleString('th-TH')

    };

    notes.unshift(note);

    saveNotesDB();

    openNote(note.id);

}


function openNotesList(){

    renderNotesList();

    document.getElementById('notesListPage')
        .style.display = 'block';

}


function closeNotesList(){

    document.getElementById('notesListPage')
        .style.display = 'none';

}


function renderNotesList(){

    const grid =
        document.getElementById('noteGrid');

    grid.innerHTML = '';

    if(!notes.length){

        grid.innerHTML = `
            <div class="noFile" style="grid-column:1/-1">
                📝 ยังไม่มีโน้ต<br><br>
                กด ＋ เพื่อสร้างโน้ตใหม่
            </div>
        `;

        return;

    }

    notes.forEach(note => {

        const card = document.createElement('div');

        card.className = 'noteCard';

        const temp =
            document.createElement('div');

        temp.innerHTML = note.content || '';

        card.innerHTML = `
            <h3>${esc(note.title || 'โน้ตไม่มีชื่อ')}</h3>

            <p>
                ${esc(temp.textContent || 'ยังไม่มีข้อความ')}
            </p>

            <small>
                ${note.files?.length || 0} ไฟล์แนบ
            </small>

            <button class="deleteNote"
                    onclick="event.stopPropagation();deleteNote(${note.id})">
                🗑️ ลบโน้ต
            </button>
        `;

        card.onclick = () => openNote(note.id);

        grid.appendChild(card);

    });

}


function deleteNote(id){

    if(!confirm('ต้องการลบโน้ตนี้ใช่ไหมคะ?')) return;

    notes = notes.filter(n => n.id !== id);

    saveNotesDB();

    renderNotesList();

}


/* =========================================================
   OPEN NOTE
========================================================= */

function openNote(id){

    currentNoteId = id;

    const note =
        notes.find(n => n.id === id);

    if(!note) return;

    document.getElementById('notesListPage')
        .style.display = 'none';

    document.getElementById('notePage')
        .style.display = 'block';

    document.getElementById('noteTitle').value =
        note.title || '';

    document.getElementById('noteEditor').innerHTML =
        note.content || '';

    attachedFiles =
        note.files || [];

    updateNoteTitle();

    renderFiles();

    selectedImage = null;

    document.getElementById('imageTools')
        .classList.remove('show');

}


function closeNotePage(){

    saveCurrentNote();

    document.getElementById('notePage')
        .style.display = 'none';

    renderNotesList();

}


function updateNoteTitle(){

    const title =
        document.getElementById('noteTitle')
            .value.trim();

    document.getElementById('noteTitleDisplay')
        .textContent =
        title || 'โน้ตใหม่';

}


function saveCurrentNote(){

    if(!currentNoteId) return;

    const note =
        notes.find(n => n.id === currentNoteId);

    if(!note) return;

    note.title =
        document.getElementById('noteTitle')
            .value.trim() || 'โน้ตใหม่';

    note.content =
        document.getElementById('noteEditor')
            .innerHTML;

    note.files =
        attachedFiles;

    saveNotesDB();

}


/* =========================================================
   TEXT EDITOR
========================================================= */

function formatText(command){

    document.execCommand(command,false,null);

    document.getElementById('noteEditor').focus();

    saveCurrentNote();

}


function changeTextColor(color){

    document.execCommand(
        'foreColor',
        false,
        color
    );

    document.getElementById('noteEditor').focus();

    saveCurrentNote();

}


/* =========================================================
   INSERT IMAGES
========================================================= */

function insertImages(e){

    const files =
        Array.from(e.target.files);

    if(!files.length) return;

    files.forEach(file => {

        if(!file.type.startsWith('image/')) return;

        const reader = new FileReader();

        reader.onload = function(ev){

            const img =
                document.createElement('img');

            img.src = ev.target.result;

            img.className = 'noteImage';

            img.style.width = '300px';

            img.addEventListener(
                'click',
                function(){

                    selectImage(img);

                }
            );

            const editor =
                document.getElementById('noteEditor');

            editor.appendChild(img);
            editor.appendChild(
                document.createElement('br')
            );

            saveCurrentNote();

        };

        reader.readAsDataURL(file);

    });

    e.target.value = '';

}


function selectImage(img){

    document.querySelectorAll('.noteImage')
        .forEach(x =>
            x.classList.remove('selected')
        );

    selectedImage = img;

    img.classList.add('selected');

    document.getElementById('imageTools')
        .classList.add('show');

    const width =
        parseInt(img.style.width) || 300;

    const percent =
        Math.min(
            100,
            Math.max(
                10,
                Math.round(width / 6)
            )
        );

    document.getElementById('imageScale')
        .value = percent;

    document.getElementById('imageScaleText')
        .textContent = percent + '%';

}


function resizeSelectedImage(value){

    if(!selectedImage) return;

    selectedImage.style.width =
        value * 6 + 'px';

    document.getElementById('imageScaleText')
        .textContent = value + '%';

    saveCurrentNote();

}


function deleteSelectedImage(){

    if(!selectedImage) return;

    selectedImage.remove();

    selectedImage = null;

    document.getElementById('imageTools')
        .classList.remove('show');

    saveCurrentNote();

}


/* =========================================================
   FILE ATTACHMENTS
========================================================= */

function addFiles(e){

    const files =
        Array.from(e.target.files);

    if(!files.length) return;

    let completed = 0;

    files.forEach(file => {

        const reader =
            new FileReader();

        reader.onload = function(ev){

            attachedFiles.push({

                id:Date.now() + Math.random(),

                name:file.name,

                size:file.size,

                type:file.type,

                data:ev.target.result,

                width:100

            });

            completed++;

            renderFiles();

            if(completed === files.length){

                saveCurrentNote();

            }

        };

        reader.readAsDataURL(file);

    });

    e.target.value = '';

}


function renderFiles(){

    const list =
        document.getElementById('fileList');

    list.innerHTML = '';

    if(!attachedFiles.length){

        list.innerHTML =
            '<div class="noFile">ยังไม่มีไฟล์ที่แนบ</div>';

        return;

    }

    attachedFiles.forEach((f,i) => {

        const el =
            document.createElement('div');

        el.className = 'fileItem';

        el.style.fontSize =
            Math.max(
                10,
                Math.min(
                    20,
                    f.width / 7
                )
            ) + 'px';

        el.innerHTML = `

            <div class="fileIcon">
                ${fileIcon(f.name)}
            </div>

            <div class="fileInfo">

                <div class="fileName">
                    ${esc(f.name)}
                </div>

                <div class="fileSize">
                    ${size(f.size)}
                </div>

                <input
                    class="fileSizeControl"
                    type="range"
                    min="60"
                    max="180"
                    value="${f.width || 100}"
                    onchange="resizeFile(${i},this.value)"
                    title="ปรับขนาดไฟล์">

            </div>

            <div class="fileActions">

                <button onclick="openFile(${i})">
                    👁️
                </button>

                <button onclick="downloadFile(${i})">
                    ⬇️
                </button>

                <button onclick="deleteFile(${i})">
                    🗑️
                </button>

            </div>
        `;

        list.appendChild(el);

    });

}


function resizeFile(i,value){

    attachedFiles[i].width =
        Number(value);

    renderFiles();

    saveCurrentNote();

}


function openFile(i){

    const f =
        attachedFiles[i];

    if(!f || !f.data) return;

    const win =
        window.open();

    if(!win){

        alert('เบราว์เซอร์บล็อกหน้าต่างใหม่ค่ะ');

        return;

    }

    if(f.type.startsWith('image/')){

        win.document.write(
            `<img src="${f.data}"
                   style="max-width:${f.width || 100}%">`
        );

    }else{

        win.document.write(`
            <iframe
                src="${f.data}"
                style="width:100%;height:100vh;border:0">
            </iframe>
        `);

    }

}


function downloadFile(i){

    const f =
        attachedFiles[i];

    if(!f || !f.data) return;

    const a =
        document.createElement('a');

    a.href = f.data;

    a.download = f.name;

    a.click();

}


function deleteFile(i){

    attachedFiles.splice(i,1);

    renderFiles();

    saveCurrentNote();

}


function fileIcon(name){

    const e =
        name.split('.').pop().toLowerCase();

    if(['jpg','jpeg','png','gif','webp','svg']
        .includes(e)) return '🖼️';

    if(e === 'pdf') return '📕';

    if(['doc','docx'].includes(e)) return '📘';

    if(['xls','xlsx'].includes(e)) return '📗';

    if(['ppt','pptx'].includes(e)) return '📙';

    if(['zip','rar','7z'].includes(e)) return '🗜️';

    if(['mp3','wav'].includes(e)) return '🎵';

    if(['mp4','mov'].includes(e)) return '🎬';

    return '📄';

}


function size(b){

    if(!b) return '';

    if(b < 1024)
        return b + ' B';

    if(b < 1048576)
        return (b / 1024).toFixed(1) + ' KB';

    return (b / 1048576).toFixed(1) + ' MB';

}


/* =========================================================
   DRAWING PAD
========================================================= */

let canvas;
let ctx;
let drawing = false;
let eraser = false;


function startDrawing(){

    const box =
        document.getElementById('drawingBox');

    box.style.display = 'block';

    canvas =
        document.getElementById('drawCanvas');

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;

    ctx =
        canvas.getContext('2d');

    ctx.scale(ratio,ratio);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    canvas.onpointerdown = startDraw;
    canvas.onpointermove = draw;
    canvas.onpointerup = stopDraw;
    canvas.onpointerleave = stopDraw;

}


function position(e){

    const r =
        canvas.getBoundingClientRect();

    return {

        x:e.clientX - r.left,

        y:e.clientY - r.top

    };

}


function startDraw(e){

    drawing = true;

    const p = position(e);

    ctx.beginPath();

    ctx.moveTo(p.x,p.y);

}


function draw(e){

    if(!drawing) return;

    const p =
        position(e);

    ctx.lineWidth =
        Number(
            document.getElementById('penSize').value
        );

    ctx.strokeStyle =
        eraser
        ? '#fffdfd'
        : document.getElementById('penColor').value;

    ctx.lineTo(p.x,p.y);

    ctx.stroke();

}


function stopDraw(){

    if(!drawing) return;

    drawing = false;

    saveDrawing();

}


function setEraser(v){

    eraser = v;

}


function clearCanvas(){

    if(!ctx) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


function saveDrawing(){

    if(!canvas) return;

    const img =
        document.createElement('img');

    img.src =
        canvas.toDataURL('image/png');

    img.className =
        'noteImage';

    img.style.width = '100%';

    img.addEventListener(
        'click',
        () => selectImage(img)
    );

    document.getElementById('noteEditor')
        .appendChild(img);

    saveCurrentNote();

}


function closeDrawing(){

    document.getElementById('drawingBox')
        .style.display = 'none';

}


/* =========================================================
   DOWNLOAD NOTE
========================================================= */

function downloadNote(){

    const title =
        document.getElementById('noteTitle')
            .value.trim() || 'โน้ต';

    const content =
        document.getElementById('noteEditor')
            .innerHTML;

    const html = `
<!DOCTYPE html>
<html lang="th">
<head>
